name: Up Next macOS build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream updates
        run: |
          git config user.name "Alehaaaa"
          git config user.email "41898283+Alehaaaa@users.noreply.github.com"
          git remote add upstream https://github.com/varunsalian/debrify.git || true
          git fetch upstream main
          git merge --no-edit upstream/main
      - name: Keep the fork current
        run: git push origin HEAD:${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - name: Get dependencies
        run: flutter pub get
      - name: Build macOS app
        run: flutter build macos --release --build-name 0.10.0-nextup --build-number ${{ github.run_number }} --dart-define=DEBRIFY_LOCAL_VALIDATION=false
      - name: Package app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent debrify.app Debrify-Up-Next.zip
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v0.10.0-nextup.${{ github.run_number }}"
          gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$VERSION" build/macos/Build/Products/Release/Debrify-Up-Next.zip --repo "$GITHUB_REPOSITORY" \
            --title "Up Next build $VERSION" --notes "Automated build of upstream Debrify with episode-link support." --latest
